<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HBlobs</title>
    <meta name="description" content="A living 2D blob. Flat by default. Candy volume optional. Product states on the element." />
    <meta property="og:title" content="HBlobs" />
    <meta property="og:url" content="https://sudopimp.github.io/HBlobs/" />
    <meta property="og:image" content="https://sudopimp.github.io/HBlobs/demos/hero.png" />
    <link rel="icon" href="demos/hero.png" />
    <style>
      :root { --ink: #f3efe6; --dim: #f3efe688; --line: #ffffff14; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #070706; color: var(--ink); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
      header, footer { display: flex; align-items: center; gap: 18px; padding: 16px 22px; }
      header { justify-content: space-between; }
      .mark { font-weight: 600; letter-spacing: -0.04em; }
      a { color: var(--dim); text-decoration: none; }
      a:hover { color: var(--ink); }
      main { display: grid; place-items: start center; padding: 8px 16px 28px; }
      .floor { position: relative; width: min(68vh, 600px); max-width: 92vw; }
      .floor::after {
        content: "";
        position: absolute; left: 18%; right: 18%; bottom: 4%; height: 36px;
        background: radial-gradient(ellipse at center, #000000aa 0%, transparent 70%);
        pointer-events: none;
      }
      #hero { display: block; width: 100%; filter: drop-shadow(0 36px 28px #00000055); }
      #hero > * { width: 100%; display: block; }
      .row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      button.dot {
        appearance: none; width: 14px; height: 14px; border-radius: 50%;
        border: 1px solid #ffffff44; cursor: pointer; padding: 0;
      }
      button.dot[aria-pressed="true"] { box-shadow: 0 0 0 3px #ffffff22; }
      button.mode, button.st {
        appearance: none; border: 1px solid var(--line); background: transparent;
        color: var(--ink); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer;
      }
      button.mode[aria-pressed="true"], button.st[aria-pressed="true"] { background: #ffffff18; }
      details { margin: 18px auto 0; max-width: 600px; color: var(--dim); font-size: 12px; }
      details summary { cursor: pointer; }
      .group { margin: 8px 0 0; }
      .group b { display: block; color: var(--dim); font-weight: 500; margin-bottom: 4px; letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
      .note { margin: 12px 0 0; text-align: center; color: var(--dim); font-size: 13px; }
      footer { color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
      footer .sp { flex: 1; }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">HBlobs</span>
      <a href="playground/lab.html">Maker</a>
    </header>
    <main>
      <div class="floor">
        <div id="hero"></div>
        <div class="row" id="skins">
          <button class="mode" data-skin="flat" aria-pressed="true" type="button">Flat</button>
          <button class="mode" data-skin="gummy" type="button">Candy</button>
        </div>
        <div class="row" id="colors"></div>
        <p class="note" id="say">flat · idle · move the pointer</p>
        <details>
          <summary>States</summary>
          <div id="states"></div>
        </details>
      </div>
    </main>
    <footer>
      <code>hermes skills install sudopimp/HBlobs/skills/blob</code>
      <span class="sp"></span>
      <a href="site/embed.html">Embed</a>
      <a href="https://github.com/sudopimp/HBlobs">GitHub</a>
      <a href="LICENSE">MIT</a>
    </footer>
    <script type="module">
      import { COLORS, STATE_GROUPS, baseRecipe, mountBlob, tint } from "./site/stage.mjs";

      const host = document.getElementById("hero");
      const say = document.getElementById("say");
      const colorBox = document.getElementById("colors");
      const stateBox = document.getElementById("states");
      const swatch = {
        pink: "#e84a9a", teal: "#5ad4c8", purple: "#7c5cff",
        yellow: "#f5c542", blue: "#4a8ae8", orange: "#f59b42",
      };
      const cycle = ["idle", "listening", "thinking", "working", "failed"];
      let color = "pink";
      let skin = "flat";
      let state = "idle";
      let el = null;
      let cycleI = 0;

      function paint() {
        el = mountBlob(host, tint(baseRecipe(), color), {
          size: 600, state, follow: true, skin,
        });
        say.textContent = `${skin} · ${state} · move the pointer · click to cycle`;
        document.querySelectorAll("#skins [data-skin]").forEach((b) => {
          b.setAttribute("aria-pressed", String(b.dataset.skin === skin));
        });
        colorBox.querySelectorAll("button").forEach((b) => {
          b.setAttribute("aria-pressed", String(b.dataset.color === color));
        });
        stateBox.querySelectorAll("button").forEach((b) => {
          b.setAttribute("aria-pressed", String(b.dataset.state === state));
        });
      }

      for (const name of COLORS) {
        const b = document.createElement("button");
        b.className = "dot";
        b.type = "button";
        b.dataset.color = name;
        b.title = name;
        b.style.background = swatch[name];
        b.addEventListener("click", () => { color = name; paint(); });
        colorBox.append(b);
      }

      for (const [group, names] of Object.entries(STATE_GROUPS)) {
        const wrap = document.createElement("div");
        wrap.className = "group";
        wrap.innerHTML = `<b>${group}</b>`;
        const row = document.createElement("div");
        row.className = "row";
        for (const name of names) {
          const b = document.createElement("button");
          b.className = "st";
          b.type = "button";
          b.dataset.state = name;
          b.textContent = name;
          b.addEventListener("click", () => {
            state = name;
            if (el) el.setAttribute("state", name);
            say.textContent = `${skin} · ${state} · move the pointer`;
            stateBox.querySelectorAll("button").forEach((x) => {
              x.setAttribute("aria-pressed", String(x.dataset.state === state));
            });
          });
          row.append(b);
        }
        wrap.append(row);
        stateBox.append(wrap);
      }

      document.getElementById("skins").addEventListener("click", (ev) => {
        const b = ev.target.closest("[data-skin]");
        if (!b) return;
        skin = b.dataset.skin === "gummy" ? "gummy" : "flat";
        paint();
      });

      host.addEventListener("click", () => {
        cycleI = (cycleI + 1) % cycle.length;
        state = cycle[cycleI];
        if (el) el.setAttribute("state", state);
        say.textContent = `${skin} · ${state} · move the pointer · click to cycle`;
      });

      paint();
    </script>
  </body>
</html>
