<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HBlobs</title>
    <meta
      name="description"
      content="A living 2D candy blob. Stadium-hole eyes, held lean, volume light. Open the page — defineBlob is already running."
    />
    <meta property="og:title" content="HBlobs" />
    <meta property="og:description" content="Live defineBlob. Not a GIF." />
    <meta property="og:url" content="https://sudopimp.github.io/HBlobs/" />
    <meta property="og:image" content="https://sudopimp.github.io/HBlobs/demos/hero.png" />
    <link rel="icon" href="demos/hero.png" />
    <style>
      :root {
        --ink: #f3efe6;
        --dim: #f3efe688;
        --line: #ffffff14;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #070706;
        color: var(--ink);
        font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header, footer {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 22px;
      }
      header { justify-content: space-between; }
      .mark { font-weight: 600; letter-spacing: -0.04em; }
      a { color: var(--dim); text-decoration: none; }
      a:hover { color: var(--ink); }
      main {
        display: grid;
        place-items: center;
        padding: 8px 16px 28px;
      }
      .floor {
        position: relative;
        width: min(72vh, 640px);
        max-width: 92vw;
      }
      .floor::after {
        content: "";
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: 6%;
        height: 36px;
        background: radial-gradient(ellipse at center, #000000aa 0%, transparent 70%);
        pointer-events: none;
      }
      #hero {
        display: block;
        width: 100%;
        filter: drop-shadow(0 36px 28px #00000055);
      }
      #hero > * { width: 100%; display: block; }
      .dots {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 8px;
      }
      button.dot {
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid #ffffff44;
        cursor: pointer;
        padding: 0;
      }
      button.dot[aria-pressed="true"] { box-shadow: 0 0 0 3px #ffffff22; }
      .note {
        margin: 18px 0 0;
        text-align: center;
        color: var(--dim);
        font-size: 13px;
      }
      footer {
        color: var(--dim);
        font-size: 12px;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }
      footer .sp { flex: 1; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">HBlobs</span>
      <a href="playground/lab.html">Maker</a>
    </header>
    <main>
      <div class="floor">
        <div id="hero"></div>
        <div class="dots" id="colors" aria-label="Color"></div>
        <p class="note" id="say">Move the pointer. Click the blob to change pose.</p>
      </div>
    </main>
    <footer>
      <code>hermes skills install sudopimp/HBlobs/skills/blob</code>
      <span class="sp"></span>
      <a href="https://github.com/sudopimp/HBlobs">GitHub</a>
      <a href="LICENSE">MIT</a>
    </footer>
    <script type="module">
      import { COLORS, STATES, baseRecipe, mountBlob, tint } from "./site/stage.mjs";

      const host = document.getElementById("hero");
      const say = document.getElementById("say");
      const box = document.getElementById("colors");
      const poses = STATES.filter((s) => s !== "failed");
      let color = "pink";
      let pose = 0;
      let el = null;

      const swatch = {
        pink: "#e84a9a",
        teal: "#5ad4c8",
        purple: "#7c5cff",
        yellow: "#f5c542",
        blue: "#4a8ae8",
        orange: "#f59b42",
      };

      function paint() {
        const state = poses[pose];
        el = mountBlob(host, tint(baseRecipe(), color), {
          size: 640,
          state,
          follow: true,
        });
        box.querySelectorAll("button").forEach((b) => {
          b.setAttribute("aria-pressed", String(b.dataset.color === color));
        });
        say.textContent = `${state} · move the pointer · click to pose`;
      }

      for (const name of COLORS) {
        const b = document.createElement("button");
        b.className = "dot";
        b.type = "button";
        b.dataset.color = name;
        b.title = name;
        b.style.background = swatch[name];
        b.addEventListener("click", () => {
          color = name;
          paint();
        });
        box.append(b);
      }

      host.addEventListener("click", () => {
        pose = (pose + 1) % poses.length;
        if (el) {
          el.setAttribute("state", poses[pose]);
          say.textContent = `${poses[pose]} · move the pointer · click to pose`;
        }
      });

      paint();
    </script>
  </body>
</html>
